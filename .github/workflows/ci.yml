name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Biasanya selesai dalam 4 menit. Tanpa batas, GitHub baru menghentikan job yang menggantung setelah 6 jam.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run knip
      - run: npm test
      # Browser Playwright disimpan di cache menurut versinya, tanpa apt-get. apt-get untuk `--with-deps` pernah menggantung
      # 6 jam (#80) dan berkali-kali lewat 10 menit di mirror Ubuntu, padahal runner sudah punya library yang dibutuhkan
      # chromium headless shell. Yang ditambahkannya hanya font dan xvfb, sedangkan app memakai fontnya sendiri.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/package.json') }}
      - run: npx playwright install --only-shell chromium
        timeout-minutes: 5
      - run: npm run test:e2e
        env:
          # Backend Convex lokal tanpa akun, dibuat baru setiap kali CI jalan.
          CONVEX_AGENT_MODE: anonymous
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
